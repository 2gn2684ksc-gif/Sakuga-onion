<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sakuga Line Extractor v12</title>
<script src="https://cloudflare.com"></script>
<style>
  :root {
    --bg: #121215;
    --panel: #1e1e24;
    --border: #2e2e38;
    --text: #f0f0f5;
    --muted: #9a9aa8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 1100px;
    margin-inline: auto;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 99px;
    background: #dc2626;
    color: #fff;
  }
  .badge.ok { background: #16a34a; }
  .header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .native-picker {
    background: #2b2b36;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    font-size: 0.85rem;
    max-width: 220px;
  }
  .top-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #172033;
    border: 1px solid #2563eb;
    padding: 10px 14px;
    border-radius: 10px;
  }
  .status { font-size: 0.88rem; color: #7dd3fc; font-weight: 600; word-break: break-word; }
  #video {
    width: 80px;
    height: 45px;
    background: #000;
    border-radius: 4px;
    border: 1px solid #334155;
    flex-shrink: 0;
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 48vh;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #e5e5e5 25%, transparent 25%),
      linear-gradient(-45deg, #e5e5e5 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e5e5 75%),
      linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
  .placeholder-msg {
    position: absolute;
    color: #333;
    background: rgba(255,255,255,0.92);
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    pointer-events: none;
    text-align: center;
    font-size: 0.9rem;
  }
  .transport {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  button {
    background: #2b2b36;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.demo { background: #0d9488; border-color: #0d9488; color: #fff; }
  .scrubber { flex: 1; min-width: 140px; accent-color: var(--accent); height: 28px; }
  .frame-readout { font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); min-width: 100px; text-align: right; }
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel);
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .card label span { color: var(--text); font-weight: 600; }
  select, .range-input { width: 100%; accent-color: var(--accent); }
  select {
    background: #2b2b36;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px;
    border-radius: 6px;
    font-size: 0.88rem;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.88rem;
  }
  .chk-input { width: 20px; height: 20px; accent-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Sakuga Line Extractor v12 <span id="jsBadge" class="badge">JS Off</span></h1>
  <div class="header-actions">
    <button id="demoBtn" class="demo">Run Test Clip</button>
    <input type="file" id="fileInput" class="native-picker">
  </div>
</header>

<div class="top-status">
  <div class="status" id="statusText">Waiting for script...</div>
  <button id="exportBtn" class="primary" disabled>Export PNGs (.zip)</button>
  <video id="video" playsinline webkit-playsinline muted preload="auto"></video>
</div>

<div class="canvas-wrap">
  <div class="placeholder-msg" id="placeholderMsg">Tap Run Test Clip or Choose File above</div>
  <canvas id="previewCanvas"></canvas>
</div>

<div class="transport">
  <button id="prevBtn" disabled>Prev (,)</button>
  <button id="playBtn" disabled>Play</button>
  <button id="nextBtn" disabled>Next (.)</button>
  <input type="range" id="scrubber" class="scrubber" min="0" max="0" value="0" disabled>
  <div class="frame-readout" id="frameReadout">Frame 0 / 0</div>
</div>

<div class="controls-grid">
  <div class="card">
    <label>Clip Frame Rate (FPS)</label>
    <select id="fpsSelect">
      <option value="24" selected>24 fps (Standard Anime)</option>
      <option value="23.976">23.976 fps (NTSC Film)</option>
      <option value="12">12 fps (On Twos)</option>
      <option value="8">8 fps (On Threes)</option>
      <option value="30">30 fps</option>
    </select>
    <label>Line Thickness / Gain <span id="gainVal">1.4x</span></label>
    <input type="range" id="gainSlider" class="range-input" min="0.5" max="3.0" step="0.1" value="1.4">
  </div>

  <div class="card">
    <label>Edge Threshold (Noise Cut) <span id="threshVal">45</span></label>
    <input type="range" id="threshSlider" class="range-input" min="5" max="150" step="1" value="45">
    <div class="toggle-row">
      <span>Show Original Video Underlay</span>
      <input type="checkbox" id="showOriginal" class="chk-input">
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span>Live Onion Skin (Red / Green)</span>
      <input type="checkbox" id="onionToggle" class="chk-input" checked>
    </div>
    <label>Onion Skin Opacity <span id="onionOpVal">45%</span></label>
    <input type="range" id="onionOpSlider" class="range-input" min="10" max="90" step="5" value="45">
  </div>
</div>

<script>
var SLASH = String.fromCharCode(47);
var DOT = String.fromCharCode(46);
var COMMA = String.fromCharCode(44);
var SPACE = String.fromCharCode(32);
var COLON = String.fromCharCode(58);

var statusText = document.getElementById(/statusText/.source);
var jsBadge = document.getElementById(/jsBadge/.source);
jsBadge.textContent = /JS Active/.source;
jsBadge.className = /badge ok/.source;
statusText.textContent = /Ready v12 - Tap Run Test Clip or Choose File/.source;

window.onerror = function(msg, src, line) {
  statusText.textContent = /JS Error line /.source + line + COLON + SPACE + msg;
};

var demoBtn = document.getElementById(/demoBtn/.source);
var fileInput = document.getElementById(/fileInput/.source);
var video = document.getElementById(/video/.source);
var previewCanvas = document.getElementById(/previewCanvas/.source);
var ctx = previewCanvas.getContext(/2d/.source);
var placeholderMsg = document.getElementById(/placeholderMsg/.source);

var prevBtn = document.getElementById(/prevBtn/.source);
var playBtn = document.getElementById(/playBtn/.source);
var nextBtn = document.getElementById(/nextBtn/.source);
var scrubber = document.getElementById(/scrubber/.source);
var frameReadout = document.getElementById(/frameReadout/.source);

var fpsSelect = document.getElementById(/fpsSelect/.source);
var threshSlider = document.getElementById(/threshSlider/.source);
var threshVal = document.getElementById(/threshVal/.source);
var gainSlider = document.getElementById(/gainSlider/.source);
var gainVal = document.getElementById(/gainVal/.source);
var showOriginal = document.getElementById(/showOriginal/.source);
var onionToggle = document.getElementById(/onionToggle/.source);
var onionOpSlider = document.getElementById(/onionOpSlider/.source);
var onionOpVal = document.getElementById(/onionOpVal/.source);
var exportBtn = document.getElementById(/exportBtn/.source);

var workCanvas = document.createElement(/canvas/.source);
var workCtx = workCanvas.getContext(/2d/.source);
var tempCanvas = document.createElement(/canvas/.source);
var tempCtx = tempCanvas.getContext(/2d/.source);

var fps = 24;
var totalFrames = 0;
var currentFrame = 0;
var isPlaying = false;
var isBusy = false;
var playTimer = null;
var demoMode = false;

function drawSyntheticDemoFrame(targetCtx, w, h, frameIdx, total) {
  var grad = targetCtx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, /#38bdf8/.source);
  grad.addColorStop(1, /#fef08a/.source);
  targetCtx.fillStyle = grad;
  targetCtx.fillRect(0, 0, w, h);

  targetCtx.fillStyle = /#4ade80/.source;
  targetCtx.fillRect(0, h * 0.78, w, h * 0.22);

  var denom = Math.max(1, total - 1);
  var t = (frameIdx / denom) * Math.PI;
var x = w * 0.2 + (frameIdx / denom) * (w * 0.6);
var bounce = Math.abs(Math.sin(t * 2));
var y = h * 0.72 - bounce * (h * 0.45);
var squash = bounce < 0.12 ? 1.25 : 0.92;
var stretch = 1 / squash;
targetCtx.save();
targetCtx.translate(x, y);
targetCtx.scale(squash, stretch);
targetCtx.fillStyle = /#f97316/.source;
targetCtx.strokeStyle = /#111827/.source;
targetCtx.lineWidth = 4;
targetCtx.beginPath();
targetCtx.arc(0, 0, 34, 0, Math.PI * 2);
targetCtx.fill();
targetCtx.stroke();
targetCtx.restore();
}
function extractLineArt(sourceCanvas, rCol, gCol, bCol) {
var w = sourceCanvas.width;
var h = sourceCanvas.height;
var srcImg = workCtx.getImageData(0, 0, w, h);
var srcView = new DataView(srcImg.data.buffer);
var outImg = workCtx.createImageData(w, h);
var dstView = new DataView(outImg.data.buffer);
var threshold = parseInt(threshSlider.value, 10);
var gain = parseFloat(gainSlider.value);
var grayBuf = new ArrayBuffer(w * h * 4);
var grayView = new DataView(grayBuf);
var totalPixels = w * h;
for (var j = 0; j < totalPixels; j++) {
var p = j * 4;
var r = srcView.getUint8(p);
var g = srcView.getUint8(p + 1);
var b = srcView.getUint8(p + 2);
var lum = 0.299 * r + 0.587 * g + 0.114 * b;
grayView.setFloat32(p, lum, true);
}
for (var y = 1; y < h - 1; y++) {
for (var x = 1; x < w - 1; x++) {
var idx = y * w + x;
var px = idx * 4;
var tl = grayView.getFloat32((idx - w - 1) * 4, true);
var tc = grayView.getFloat32((idx - w) * 4, true);
var tr = grayView.getFloat32((idx - w + 1) * 4, true);
var ml = grayView.getFloat32((idx - 1) * 4, true);
var mr = grayView.getFloat32((idx + 1) * 4, true);
var bl = grayView.getFloat32((idx + w - 1) * 4, true);
var bc = grayView.getFloat32((idx + w) * 4, true);
var br = grayView.getFloat32((idx + w + 1) * 4, true);
var gx = -tl + tr - 2 * ml + 2 * mr - bl + br;
var gy = -tl - 2 * tc - tr + bl + 2 * bc + br;
var mag = Math.sqrt(gx * gx + gy * gy) * 0.25;
if (mag > threshold) {
var alpha = Math.min(255, Math.round((mag - threshold) * gain * 2.2));
dstView.setUint8(px, rCol);
dstView.setUint8(px + 1, gCol);
dstView.setUint8(px + 2, bCol);
dstView.setUint8(px + 3, alpha);
} else {
dstView.setUint8(px + 3, 0);
}
}
}
return outImg;
}
function seekToTime(time, done) {
var clamped = Math.max(0, Math.min(video.duration - 0.001, time));
if (Math.abs(video.currentTime - clamped) < 0.0005 && video.readyState >= 2) {
done();
return;
}
var timer = setTimeout(function() {
video.removeEventListener(/seeked/.source, onSeeked);
done();
}, 450);
function onSeeked() {
clearTimeout(timer);
video.removeEventListener(/seeked/.source, onSeeked);
done();
}
video.addEventListener(/seeked/.source, onSeeked);
video.currentTime = clamped;
}
function loadFrameIntoWorkCanvas(frameIdx, w, h, done) {
if (demoMode) {
drawSyntheticDemoFrame(workCtx, w, h, frameIdx, totalFrames);
done();
} else {
seekToTime(frameIdx / fps, function() {
workCtx.drawImage(video, 0, 0, w, h);
done();
});
}
}
function renderFrame(frameIndex) {
if ((!video.duration && !demoMode) || isBusy) return;
isBusy = true;
currentFrame = Math.max(0, Math.min(totalFrames - 1, frameIndex));
scrubber.value = currentFrame;
frameReadout.textContent = /Frame /.source + (currentFrame + 1) + SPACE + SLASH + SPACE + totalFrames;
var w = previewCanvas.width;
var h = previewCanvas.height;
ctx.clearRect(0, 0, w, h);
var useOnion = onionToggle.checked && !isPlaying;
var onionAlpha = parseInt(onionOpSlider.value, 10) / 100;
function drawPrev(nextStep) {
if (useOnion && currentFrame > 0) {
loadFrameIntoWorkCanvas(currentFrame - 1, w, h, function() {
var prevLines = extractLineArt(workCanvas, 239, 68, 68);
tempCtx.putImageData(prevLines, 0, 0);
ctx.save();
ctx.globalAlpha = onionAlpha;
ctx.drawImage(tempCanvas, 0, 0);
ctx.restore();
nextStep();
});
} else {
nextStep();
}
}
function drawNext(nextStep) {
if (useOnion && currentFrame < totalFrames - 1) {
loadFrameIntoWorkCanvas(currentFrame + 1, w, h, function() {
var nextLines = extractLineArt(workCanvas, 34, 197, 94);
tempCtx.putImageData(nextLines, 0, 0);
ctx.save();
ctx.globalAlpha = onionAlpha;
ctx.drawImage(tempCanvas, 0, 0);
ctx.restore();
nextStep();
});
} else {
nextStep();
}
}
drawPrev(function() {
drawNext(function() {
loadFrameIntoWorkCanvas(currentFrame, w, h, function() {
if (showOriginal.checked) {
ctx.save();
ctx.globalAlpha = 0.35;
ctx.drawImage(workCanvas, 0, 0, w, h);
ctx.restore();
}
var currLines = extractLineArt(workCanvas, 0, 0, 0);
tempCtx.putImageData(currLines, 0, 0);
ctx.drawImage(tempCanvas, 0, 0);
isBusy = false;
});
});
});
}
demoBtn.addEventListener(/click/.source, function() {
stopPlayback();
demoMode = true;
fps = parseFloat(fpsSelect.value);
totalFrames = 24;
currentFrame = 6;
previewCanvas.width = 640;
previewCanvas.height = 360;
workCanvas.width = 640;
workCanvas.height = 360;
tempCanvas.width = 640;
tempCanvas.height = 360;
scrubber.max = totalFrames - 1;
scrubber.value = currentFrame;
placeholderMsg.style.display = /none/.source;
prevBtn.disabled = false;
playBtn.disabled = false;
nextBtn.disabled = false;
scrubber.disabled = false;
exportBtn.disabled = false;
statusText.textContent = /Test Clip active - Red is Prev frame, Green is Next frame/.source;
renderFrame(currentFrame);
});
fileInput.addEventListener(/change/.source, function(e) {
if (!e.target.files || e.target.files.length === 0) return;
var file = e.target.files.item(0);
stopPlayback();
demoMode = false;
statusText.textContent = /Loading /.source + file.name;
placeholderMsg.textContent = /Decoding /.source + file.name;
placeholderMsg.style.display = /block/.source;
var url = URL.createObjectURL(file);
video.src = url;
video.load();
});
video.addEventListener(/error/.source, function() {
var errCode = video.error ? video.error.code : 0;
statusText.textContent = /Cannot decode video Code /.source + errCode + / - Convert webm to H264 mp4/.source;
placeholderMsg.textContent = /Unsupported video codec - convert to H264 mp4/.source;
});
video.addEventListener(/loadedmetadata/.source, function() {
statusText.textContent = /Metadata ready - Decoding frame 1/.source;
try {
var p = video.play();
if (p && p.then) {
p.then(function() { video.pause(); }).catch(function() {});
}
} catch (err) {}
fps = parseFloat(fpsSelect.value);
totalFrames = Math.max(1, Math.floor(video.duration * fps));
currentFrame = 0;
previewCanvas.width = video.videoWidth;
previewCanvas.height = video.videoHeight;
workCanvas.width = video.videoWidth;
workCanvas.height = video.videoHeight;
tempCanvas.width = video.videoWidth;
tempCanvas.height = video.videoHeight;
scrubber.max = totalFrames - 1;
scrubber.value = 0;
placeholderMsg.style.display = /none/.source;
prevBtn.disabled = false;
playBtn.disabled = false;
nextBtn.disabled = false;
scrubber.disabled = false;
exportBtn.disabled = false;
statusText.textContent = /Loaded /.source + video.videoWidth + /x/.source + video.videoHeight + SPACE + totalFrames + / frames/.source;
renderFrame(0);
});
function stopPlayback() {
isPlaying = false;
playBtn.textContent = /Play/.source;
clearInterval(playTimer);
}
playBtn.addEventListener(/click/.source, function() {
if (isPlaying) {
stopPlayback();
renderFrame(currentFrame);
return;
}
isPlaying = true;
playBtn.textContent = /Pause/.source;
playTimer = setInterval(function() {
if (isBusy) return;
var next = (currentFrame + 1) % totalFrames;
renderFrame(next);
}, 1000 / fps);
});
prevBtn.addEventListener(/click/.source, function() { stopPlayback(); renderFrame(currentFrame - 1); });
nextBtn.addEventListener(/click/.source, function() { stopPlayback(); renderFrame(currentFrame + 1); });
scrubber.addEventListener(/input/.source, function() { stopPlayback(); renderFrame(parseInt(scrubber.value, 10)); });
fpsSelect.addEventListener(/change/.source, function() {
fps = parseFloat(fpsSelect.value);
if (video.duration && !demoMode) {
totalFrames = Math.max(1, Math.floor(video.duration * fps));
scrubber.max = totalFrames - 1;
renderFrame(Math.min(currentFrame, totalFrames - 1));
}
});
threshSlider.addEventListener(/input/.source, function() {
threshVal.textContent = threshSlider.value;
renderFrame(currentFrame);
});
gainSlider.addEventListener(/input/.source, function() {
gainVal.textContent = parseFloat(gainSlider.value).toFixed(1) + /x/.source;
renderFrame(currentFrame);
});
onionOpSlider.addEventListener(/input/.source, function() {
onionOpVal.textContent = onionOpSlider.value + /%/.source;
renderFrame(currentFrame);
});
showOriginal.addEventListener(/change/.source, function() { renderFrame(currentFrame); });
onionToggle.addEventListener(/change/.source, function() { renderFrame(currentFrame); });
window.addEventListener(/keydown/.source, function(e) {
if (!video.duration && !demoMode) return;
if (e.key === COMMA) { stopPlayback(); renderFrame(currentFrame - 1); }
if (e.key === DOT) { stopPlayback(); renderFrame(currentFrame + 1); }
if (e.key === SPACE) { e.preventDefault(); playBtn.click(); }
});
exportBtn.addEventListener(/click/.source, function() {
if ((!video.duration && !demoMode) || isBusy) return;
if (typeof JSZip === /undefined/.source) {
statusText.textContent = /JSZip library still loading - check internet and retry/.source;
return;
}
stopPlayback();
isBusy = true;
exportBtn.disabled = true;
var zip = new JSZip();
var folder = zip.folder(/sakuga_lines/.source);
var w = previewCanvas.width;
var h = previewCanvas.height;
var i = 0;
function processNext() {
if (i >= totalFrames) {
statusText.textContent = /Compressing zip file/.source;
zip.generateAsync({ type: /blob/.source }).then(function(zipBlob) {
var link = document.createElement(/a/.source);
link.href = URL.createObjectURL(zipBlob);
link.download = /sakuga_transparent_lines/.source + DOT + /zip/.source;
link.click();
statusText.textContent = /Done - Exported /.source + totalFrames + / transparent PNGs/.source;
exportBtn.disabled = false;
isBusy = false;
renderFrame(currentFrame);
});
return;
}
statusText.textContent = /Extracting frame /.source + (i + 1) + / of /.source + totalFrames;
loadFrameIntoWorkCanvas(i, w, h, function() {
var lineImg = extractLineArt(workCanvas, 0, 0, 0);
tempCtx.putImageData(lineImg, 0, 0);
tempCanvas.toBlob(function(blob) {
var num = String(i + 1);
while (num.length < 4) { num = /0/.source + num; }
folder.file(/frame_/.source + num + DOT + /png/.source, blob);
i++;
processNext();
}, /image/.source + SLASH + /png/.source);
});
}
processNext();
});
