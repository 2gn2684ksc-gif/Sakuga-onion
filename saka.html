<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sakuga Line Extractor & Onion Player</title>
<script src="https://cloudflare.com"></script>
<style>
  :root {
    --bg: #121215;
    --panel: #1e1e24;
    --border: #2e2e38;
    --text: #f0f0f5;
    --muted: #9a9aa8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 1100px;
    margin-inline: auto;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 99px;
    background: #dc2626;
    color: #fff;
  }
  .badge.ok { background: #16a34a; }
  .header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .native-picker {
    background: #2b2b36;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    font-size: 0.85rem;
    max-width: 220px;
  }

  .top-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #172033;
    border: 1px solid #2563eb;
    padding: 10px 14px;
    border-radius: 10px;
  }
  .status { font-size: 0.88rem; color: #7dd3fc; font-weight: 600; word-break: break-word; }
  #video {
    width: 80px;
    height: 45px;
    background: #000;
    border-radius: 4px;
    border: 1px solid #334155;
    flex-shrink: 0;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 48vh;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #e5e5e5 25%, transparent 25%),
      linear-gradient(-45deg, #e5e5e5 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e5e5 75%),
      linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }
  .placeholder-msg {
    position: absolute;
    color: #333;
    background: rgba(255,255,255,0.92);
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    pointer-events: none;
    text-align: center;
    font-size: 0.9rem;
  }

  .transport {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  button {
    background: #2b2b36;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.demo { background: #0d9488; border-color: #0d9488; color: #fff; }
  .scrubber { flex: 1; min-width: 140px; accent-color: var(--accent); height: 28px; }
  .frame-readout { font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); min-width: 100px; text-align: right; }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel);
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .card label span { color: var(--text); font-weight: 600; }
  select, input { accent-color: var(--accent); }
  select, .range-input { width: 100%; }
  select {
    background: #2b2b36;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px;
    border-radius: 6px;
    font-size: 0.88rem;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.88rem;
  }
  .chk-input { width: 20px; height: 20px; }
</style>
</head>
<body>

<header>
  <h1>Sakuga Line Extractor v9 <span id="jsBadge" class="badge">JS Off</span></h1>
  <div class="header-actions">
    <button id="demoBtn" class="demo">Run Test Clip</button>
    <input type="file" id="fileInput" class="native-picker">
  </div>
</header>

<div class="top-status">
  <div class="status" id="statusText">Waiting for script...</div>
  <button id="exportBtn" class="primary" disabled>Export PNGs (.zip)</button>
  <video id="video" playsinline webkit-playsinline muted preload="auto"></video>
</div>

<div class="canvas-wrap">
  <div class="placeholder-msg" id="placeholderMsg">Tap "Run Test Clip" or "Choose File" above</div>
  <canvas id="previewCanvas"></canvas>
</div>

<div class="transport">
  <button id="prevBtn" disabled>◀ Prev (,)</button>
  <button id="playBtn" disabled>▶ Play</button>
  <button id="nextBtn" disabled>Next (.) ▶</button>
  <input type="range" id="scrubber" class="scrubber" min="0" max="0" value="0" disabled>
  <div class="frame-readout" id="frameReadout">Frame 0 / 0</div>
</div>

<div class="controls-grid">
  <div class="card">
    <label>Clip Frame Rate (FPS)</label>
    <select id="fpsSelect">
      <option value="24" selected>24 fps (Standard Anime)</option>
      <option value="23.976">23.976 fps (NTSC Film)</option>
      <option value="12">12 fps (On Twos)</option>
      <option value="8">8 fps (On Threes)</option>
      <option value="30">30 fps</option>
    </select>
    <label>Line Thickness / Gain <span id="gainVal">1.4x</span></label>
    <input type="range" id="gainSlider" class="range-input" min="0.5" max="3.0" step="0.1" value="1.4">
  </div>

  <div class="card">
    <label>Edge Threshold (Noise Cut) <span id="threshVal">45</span></label>
    <input type="range" id="threshSlider" class="range-input" min="5" max="150" step="1" value="45">
    <div class="toggle-row">
      <span>Show Original Video Underlay</span>
      <input type="checkbox" id="showOriginal" class="chk-input">
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span>Live Onion Skin (Red / Green)</span>
      <input type="checkbox" id="onionToggle" class="chk-input" checked>
    </div>
    <label>Onion Skin Opacity <span id="onionOpVal">45%</span></label>
    <input type="range" id="onionOpSlider" class="range-input" min="10" max="90" step="5" value="45">
  </div>
</div>

<script>
const statusText = document.getElementById('statusText');
const jsBadge = document.getElementById('jsBadge');
jsBadge.textContent = 'JS Active';
jsBadge.classList.add('ok');
statusText.textContent = 'Ready (v9). Tap "Run Test Clip" or pick your .mp4.';

window.onerror = function(msg, src, line) {
  statusText.textContent = 'Error line ' + line + ': ' + msg;
};

const demoBtn = document.getElementById('demoBtn');
const fileInput = document.getElementById('fileInput');
const video = document.getElementById('video');
const previewCanvas = document.getElementById('previewCanvas');
const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });
const placeholderMsg = document.getElementById('placeholderMsg');

const prevBtn = document.getElementById('prevBtn');
const playBtn = document.getElementById('playBtn');
const nextBtn = document.getElementById('nextBtn');
const scrubber = document.getElementById('scrubber');
const frameReadout = document.getElementById('frameReadout');

const fpsSelect = document.getElementById('fpsSelect');
const threshSlider = document.getElementById('threshSlider');
const threshVal = document.getElementById('threshVal');
const gainSlider = document.getElementById('gainSlider');
const gainVal = document.getElementById('gainVal');
const showOriginal = document.getElementById('showOriginal');
const onionToggle = document.getElementById('onionToggle');
const onionOpSlider = document.getElementById('onionOpSlider');
const onionOpVal = document.getElementById('onionOpVal');
const exportBtn = document.getElementById('exportBtn');

const workCanvas = document.createElement('canvas');
const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });
const tempCanvas = document.createElement('canvas');
const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

let fps = 24;
let totalFrames = 0;
let currentFrame = 0;
let isPlaying = false;
let isBusy = false;
let playTimer = null;
let demoMode = false;

function drawSyntheticDemoFrame(targetCtx, w, h, frameIdx, total) {
  // Full-colour anime-style gradient background (proves background gets stripped!)
  const grad = targetCtx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#38bdf8');
  grad.addColorStop(1, '#fef08a');
  targetCtx.fillStyle = grad;
  targetCtx.fillRect(0, 0, w, h);

  // Ground plane
  targetCtx.fillStyle = '#4ade80';
  targetCtx.fillRect(0, h * 0.78, w, h * 0.22);

  // Bouncing character ball with squash & stretch
  const t = (frameIdx / Math.max(1, total - 1)) * Math.PI;
  const x = w * 0.2 + (frameIdx / Math.max(1, total - 1)) * (w * 0.6);
  const bounce = Math.abs(Math.sin(t * 2));
const y = h * 0.72 - bounce * (h * 0.45);
const squash = bounce < 0.12 ? 1.25 : 0.92;
const stretch = 1 / squash;
targetCtx.save();
targetCtx.translate(x, y);
targetCtx.scale(squash, stretch);
targetCtx.fillStyle = '#f97316';
targetCtx.strokeStyle = '#111827';
targetCtx.lineWidth = 4;
targetCtx.beginPath();
targetCtx.arc(0, 0, 34, 0, Math.PI * 2);
targetCtx.fill();
targetCtx.stroke();
targetCtx.restore();
}
function extractLineArt(sourceCanvas, rCol, gCol, bCol) {
const w = sourceCanvas.width;
const h = sourceCanvas.height;
const srcImg = workCtx.getImageData(0, 0, w, h);
const srcView = new DataView(srcImg.data.buffer);
const outImg = workCtx.createImageData(w, h);
const dstView = new DataView(outImg.data.buffer);
const threshold = parseInt(threshSlider.value, 10);
const gain = parseFloat(gainSlider.value);
const grayBuf = new ArrayBuffer(w * h * 4);
const grayView = new DataView(grayBuf);
const totalPixels = w * h;
for (let j = 0; j < totalPixels; j++) {
const p = j * 4;
const r = srcView.getUint8(p);
const g = srcView.getUint8(p + 1);
const b = srcView.getUint8(p + 2);
const lum = 0.299 * r + 0.587 * g + 0.114 * b;
grayView.setFloat32(p, lum, true);
}
for (let y = 1; y < h - 1; y++) {
for (let x = 1; x < w - 1; x++) {
const idx = y * w + x;
const p = idx * 4;
const tl = grayView.getFloat32((idx - w - 1) * 4, true);
const tc = grayView.getFloat32((idx - w) * 4, true);
const tr = grayView.getFloat32((idx - w + 1) * 4, true);
const ml = grayView.getFloat32((idx - 1) * 4, true);
const mr = grayView.getFloat32((idx + 1) * 4, true);
const bl = grayView.getFloat32((idx + w - 1) * 4, true);
const bc = grayView.getFloat32((idx + w) * 4, true);
const br = grayView.getFloat32((idx + w + 1) * 4, true);
const gx = -tl + tr - 2 * ml + 2 * mr - bl + br;
const gy = -tl - 2 * tc - tr + bl + 2 * bc + br;
const mag = Math.sqrt(gx * gx + gy * gy) * 0.25;
if (mag > threshold) {
const alpha = Math.min(255, Math.round((mag - threshold) * gain * 2.2));
dstView.setUint8(p, rCol);
dstView.setUint8(p + 1, gCol);
dstView.setUint8(p + 2, bCol);
dstView.setUint8(p + 3, alpha);
} else {
dstView.setUint8(p + 3, 0);
}
}
}
return outImg;
}
function seekToTime(time) {
return new Promise((resolve) => {
const clamped = Math.max(0, Math.min(video.duration - 0.001, time));
if (Math.abs(video.currentTime - clamped) < 0.0005 && video.readyState >= 2) {
resolve();
return;
}
const timeout = setTimeout(resolve, 400);
const onSeeked = () => {
clearTimeout(timeout);
video.removeEventListener('seeked', onSeeked);
resolve();
};
video.addEventListener('seeked', onSeeked);
video.currentTime = clamped;
});
}
async function loadFrameIntoWorkCanvas(frameIdx, w, h) {
if (demoMode) {
drawSyntheticDemoFrame(workCtx, w, h, frameIdx, totalFrames);
} else {
await seekToTime(frameIdx / fps);
workCtx.drawImage(video, 0, 0, w, h);
}
}
async function renderFrame(frameIndex) {
if ((!video.duration && !demoMode) || isBusy) return;
isBusy = true;
currentFrame = Math.max(0, Math.min(totalFrames - 1, frameIndex));
scrubber.value = currentFrame;
frameReadout.textContent = Frame ${currentFrame + 1} / ${totalFrames};
const w = previewCanvas.width;
const h = previewCanvas.height;
ctx.clearRect(0, 0, w, h);
const useOnion = onionToggle.checked && !isPlaying;
const onionAlpha = parseInt(onionOpSlider.value, 10) / 100;
if (useOnion && currentFrame > 0) {
await loadFrameIntoWorkCanvas(currentFrame - 1, w, h);
const prevLines = extractLineArt(workCanvas, 239, 68, 68);
tempCtx.putImageData(prevLines, 0, 0);
ctx.save();
ctx.globalAlpha = onionAlpha;
ctx.drawImage(tempCanvas, 0, 0);
ctx.restore();
}
if (useOnion && currentFrame < totalFrames - 1) {
await loadFrameIntoWorkCanvas(currentFrame + 1, w, h);
const nextLines = extractLineArt(workCanvas, 34, 197, 94);
tempCtx.putImageData(nextLines, 0, 0);
ctx.save();
ctx.globalAlpha = onionAlpha;
ctx.drawImage(tempCanvas, 0, 0);
ctx.restore();
}
await loadFrameIntoWorkCanvas(currentFrame, w, h);
if (showOriginal.checked) {
ctx.save();
ctx.globalAlpha = 0.35;
ctx.drawImage(workCanvas, 0, 0, w, h);
ctx.restore();
}
const currLines = extractLineArt(workCanvas, 0, 0, 0);
tempCtx.putImageData(currLines, 0, 0);
ctx.drawImage(tempCanvas, 0, 0);
isBusy = false;
}
demoBtn.addEventListener('click', () => {
stopPlayback();
demoMode = true;
fps = parseFloat(fpsSelect.value);
totalFrames = 24;
currentFrame = 6;
previewCanvas.width = 640;
previewCanvas.height = 360;
workCanvas.width = 640;
workCanvas.height = 360;
tempCanvas.width = 640;
tempCanvas.height = 360;
scrubber.max = totalFrames - 1;
scrubber.value = currentFrame;
placeholderMsg.style.display = 'none';
prevBtn.disabled = false;
playBtn.disabled = false;
nextBtn.disabled = false;
scrubber.disabled = false;
exportBtn.disabled = false;
statusText.textContent = 'Test Clip active (24 frames). Red = Prev frame, Green = Next frame!';
renderFrame(currentFrame);
});
function loadFileObject(file) {
if (!file) return;
stopPlayback();
demoMode = false;
statusText.textContent = Loading ${file.name} (${Math.round(file.size / 1024)} KB)...;
placeholderMsg.textContent = Decoding ${file.name}...;
placeholderMsg.style.display = 'block';
const url = URL.createObjectURL(file);
video.src = url;
video.load();
}
fileInput.addEventListener('change', (e) => {
if (e.target.files && e.target.files.length > 0) {
loadFileObject(e.target.files.item(0));
}
});
video.addEventListener('error', () => {
const errCode = video.error ? video.error.code : 'unknown';
statusText.textContent = Cannot decode video (Code ${errCode}). Convert .webm / VP9 / AV1 to H.264 .mp4 first.;
placeholderMsg.textContent = 'Unsupported video codec — convert to H.264 .mp4';
});
video.addEventListener('loadedmetadata', async () => {
statusText.textContent = Metadata ready (${video.videoWidth}x${video.videoHeight}). Decoding frame 1...;
try {
await video.play();
video.pause();
} catch (err) {}
fps = parseFloat(fpsSelect.value);
totalFrames = Math.max(1, Math.floor(video.duration * fps));
currentFrame = 0;
previewCanvas.width = video.videoWidth;
previewCanvas.height = video.videoHeight;
workCanvas.width = video.videoWidth;
workCanvas.height = video.videoHeight;
tempCanvas.width = video.videoWidth;
tempCanvas.height = video.videoHeight;
scrubber.max = totalFrames - 1;
scrubber.value = 0;
placeholderMsg.style.display = 'none';
prevBtn.disabled = false;
playBtn.disabled = false;
nextBtn.disabled = false;
scrubber.disabled = false;
exportBtn.disabled = false;
statusText.textContent = Loaded ${video.videoWidth}×${video.videoHeight} (${totalFrames} frames @ ${fps} fps);
renderFrame(0);
});
function stopPlayback() {
isPlaying = false;
playBtn.textContent = '▶ Play';
clearInterval(playTimer);
}
playBtn.addEventListener('click', () => {
if (isPlaying) {
stopPlayback();
renderFrame(currentFrame);
return;
}
isPlaying = true;
playBtn.textContent = '❚❚ Pause';
playTimer = setInterval(() => {
if (isBusy) return;
const next = (currentFrame + 1) % totalFrames;
renderFrame(next);
}, 1000 / fps);
});
prevBtn.addEventListener('click', () => { stopPlayback(); renderFrame(currentFrame - 1); });
nextBtn.addEventListener('click', () => { stopPlayback(); renderFrame(currentFrame + 1); });
scrubber.addEventListener('input', () => { stopPlayback(); renderFrame(parseInt(scrubber.value, 10)); });
fpsSelect.addEventListener('change', () => {
fps = parseFloat(fpsSelect.value);
if (video.duration && !demoMode) {
totalFrames = Math.max(1, Math.floor(video.duration * fps));
scrubber.max = totalFrames - 1;
renderFrame(Math.min(currentFrame, totalFrames - 1));
}
});
threshSlider.addEventListener('input', () => {
threshVal.textContent = threshSlider.value;
renderFrame(currentFrame);
});
gainSlider.addEventListener('input', () => {
gainVal.textContent = ${parseFloat(gainSlider.value).toFixed(1)}x;
renderFrame(currentFrame);
});
onionOpSlider.addEventListener('input', () => {
onionOpVal.textContent = ${onionOpSlider.value}%;
renderFrame(currentFrame);
});
showOriginal.addEventListener('change', () => renderFrame(currentFrame));
onionToggle.addEventListener('change', () => renderFrame(currentFrame));
window.addEventListener('keydown', (e) => {
if (!video.duration && !demoMode) return;
if (e.key === ',') { stopPlayback(); renderFrame(currentFrame - 1); }
if (e.key === '.') { stopPlayback(); renderFrame(currentFrame + 1); }
if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
});
exportBtn.addEventListener('click', async () => {
if ((!video.duration && !demoMode) || isBusy) return;
stopPlayback();
isBusy = true;
exportBtn.disabled = true;
const zip = new JSZip();
const folder = zip.folder('sakuga_lines');
const w = previewCanvas.width;
const h = previewCanvas.height;
for (let i = 0; i < totalFrames; i++) {
statusText.textContent = Extracting frame ${i + 1} of ${totalFrames}...;
await loadFrameIntoWorkCanvas(i, w, h);
const lineImg = extractLineArt(workCanvas, 0, 0, 0);
tempCtx.putImageData(lineImg, 0, 0);
const blob = await new Promise(res => tempCanvas.toBlob(res, 'image/png'));
const fileName = frame_${String(i + 1).padStart(4, '0')}.png;
folder.file(fileName, blob);
}
statusText.textContent = 'Compressing .zip file...';
const zipBlob = await zip.generateAsync({ type: 'blob' });
const link = document.createElement('a');
link.href = URL.createObjectURL(zipBlob);
link.download = 'sakuga_transparent_lines.zip';
link.click();
statusText.textContent = Done! Exported ${totalFrames} transparent PNGs.;
exportBtn.disabled = false;
isBusy = false;
renderFrame(currentFrame);
});
