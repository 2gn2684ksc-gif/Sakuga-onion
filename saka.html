<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sakuga Onion v20</title>
<script src="https://cloudflare.com"></script>
<style>
body{margin:0;padding:12px;background:#121215;color:#f0f0f5;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;gap:10px;max-width:960px;margin-inline:auto}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:#1e1e24;padding:10px 14px;border-radius:10px;border:1px solid #2e2e38}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:#16a34a;color:#fff}
.status{background:#172033;border:1px solid #2563eb;padding:10px 14px;border-radius:10px;color:#7dd3fc;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{position:relative;width:100%;aspect-ratio:16/9;max-height:50vh;border-radius:10px;overflow:hidden;border:1px solid #2e2e38;display:flex;align-items:center;justify-content:center;background:#ffffff}
.checker{background-image:linear-gradient(45deg,#e5e5e5 25%,transparent 25%),linear-gradient(-45deg,#e5e5e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e5e5 75%),linear-gradient(-45deg,transparent 75%,#e5e5e5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
canvas{max-width:100%;max-height:100%}
button{background:#2b2b36;color:#fff;border:1px solid #3f3f4e;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px}
button:disabled{opacity:.4}
.blue{background:#3b82f6;border-color:#3b82f6}
.range{flex:1;min-width:110px}
video{width:96px;height:54px;background:#000;border-radius:4px}
</style>
</head>
<body>
<div class="bar">
  <b>Sakuga Onion v20 <span class="badge">JS Active</span></b>
  <input type="file" id="fileIn" style="max-width:210px;color:#fff">
</div>
<div class="status">
  <span id="st">Ready (v20)! Pick your .mp4 clip above.</span>
  <button id="expBtn" class="blue" disabled>Export PNGs (.zip)</button>
  <video id="vid" playsinline webkit-playsinline muted preload="auto"></video>
</div>
<div class="wrap" id="wrap"><canvas id="cvs"></canvas></div>
<div class="bar">
  <button id="prv" disabled>Prev</button>
  <button id="ply" disabled>Play</button>
  <button id="nxt" disabled>Next</button>
  <input type="range" id="scb" class="range" min="0" max="0" value="0" disabled>
  <span id="fnum">0/0</span>
</div>
<div class="bar">
  <label>Mode <select id="mode">
    <option value="motionEdge" selected>Video + Moving Outlines</option>
    <option value="cleanEdge">Clean Lines Only (White BG)</option>
    <option value="ink">Ink / Genga (Dark Lines)</option>
  </select></label>
  <label>Step <select id="stp"><option value="1">1f</option><option value="2" selected>2f (Twos)</option><option value="3">3f</option><option value="4">4f</option></select></label>
  <label>Cut <input type="range" id="thr" min="5" max="150" value="32"></label>
  <label>Line <input type="range" id="gn" min="0.5" max="4" step="0.1" value="1.8"></label>
  <label><input type="checkbox" id="oni" checked> Onion</label>
  <label><input type="checkbox" id="chkBg"> Grid</label>
</div>
<script>
const $=id=>document.getElementById(id),cvs=$("cvs"),ctx=cvs.getContext("2d"),vid=$("vid");
const tC=document.createElement("canvas"),tX=tC.getContext("2d");
let fps=24,frames=new Array(),cur=0,playing=false,tmr=null;

function extract(srcData,refData,rC,gC,bC,onlyMoving){
  const w=cvs.width,h=cvs.height,out=tX.createImageData(w,h),d=out.data,th=Number($("thr").value),gn=Number($("gn").value),md=$("mode").value;
  if(md==="ink"){
    for(let i=0;i<srcData.length;i+=4){
      const lum=.299*srcData.at(i)+.587*srcData.at(i+1)+.114*srcData.at(i+2),dark=255-lum;
      if(dark>th){d.set(Array.of(rC,gC,bC,Math.min(255,(dark-th)*gn*1.6)),i);}
    }
    return out;
  }
  const gr=new Float32Array(w*h);
  for(let i=0,j=0;i<srcData.length;i+=4,j++)gr.set(Array.of(.299*srcData.at(i)+.587*srcData.at(i+1)+.114*srcData.at(i+2)),j);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x,p=i*4;
    if(onlyMoving&&refData){
      const diff=(Math.abs(srcData.at(p)-refData.at(p))+Math.abs(srcData.at(p+1)-refData.at(p+1))+Math.abs(srcData.at(p+2)-refData.at(p+2)))/3;
      if(diff<18)continue;
    }
    const gx=-gr.at(i-w-1)+gr.at(i-w+1)-2*gr.at(i-1)+2*gr.at(i+1)-gr.at(i+w-1)+gr.at(i+w+1);
    const gy=-gr.at(i-w-1)-2*gr.at(i-w)-gr.at(i-w+1)+gr.at(i+w-1)+2*gr.at(i+w)+gr.at(i+w+1);
    const mg=Math.hypot(gx,gy)*.25;
    if(mg>th){d.set(Array.of(rC,gC,bC,Math.min(255,(mg-th)*gn*2.2)),p);}
  }
  return out;
}

function render(f){
  if(!frames.length)return;
  cur=Math.max(0,Math.min(frames.length-1,f));$("scb").value=cur;$("fnum").textContent=(cur+1)+"/"+frames.length;
  const w=cvs.width,h=cvs.height,step=Number($("stp").value),md=$("mode").value,currPix=frames.at(cur);
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;ctx.clearRect(0,0,w,h);
  if(md==="motionEdge"){
    tX.putImageData(new ImageData(currPix,w,h),0,0);ctx.drawImage(tC,0,0);
  }else{
    tX.putImageData(extract(currPix,null,15,23,42,false),0,0);ctx.drawImage(tC,0,0);
  }
  if($("oni").checked&&!playing){
    const mask=(md==="motionEdge")?currPix:null;
    if(cur-step>=0){tX.putImageData(extract(frames.at(cur-step),mask,239,68,68,true),0,0);ctx.globalAlpha=.55;ctx.drawImage(tC,0,0);}
    if(cur+step<frames.length){tX.putImageData(extract(frames.at(cur+step),mask,34,197,94,true),0,0);ctx.globalAlpha=.55;ctx.drawImage(tC,0,0);}
  }
  ctx.globalAlpha=1;
}

async function cacheAllFrames(){
  const w=vid.videoWidth,h=vid.videoHeight,tot=Math.max(1,Math.floor(vid.duration*fps));
  cvs.width=tC.width=w;cvs.height=tC.height=h;frames=new Array();
  for(let i=0;i<tot;i++){
    $("st").textContent="Caching frame "+(i+1)+"/"+tot+"...";
    await new Promise(r=>{
      const target=Math.min(vid.duration-.001,i/fps);
      const onSeek=()=>{vid.removeEventListener("seeked",onSeek);requestAnimationFrame(()=>requestAnimationFrame(r));};
      vid.addEventListener("seeked",onSeek);
      vid.currentTime=target;
    });
    tX.drawImage(vid,0,0,w,h);
    frames.push(new Uint8ClampedArray(tX.getImageData(0,0,w,h).data));
  }
  $("scb").max=frames.length-1;
  Array.of("prv","ply","nxt","scb","expBtn").forEach(id=>$(id).disabled=false);
  $("st").textContent="Ready! "+frames.length+" frames cached ("+w+"x"+h+")";
  render(0);
}

function loadVid(f){if(!f)return;clearInterval(tmr);playing=false;$("ply").textContent="Play";frames=new Array();$("st").textContent="Loading "+f.name+"...";vid.src=URL.createObjectURL(f);vid.load();}
$("fileIn").onchange=e=>{if(e.target.files)loadVid(e.target.files.item(0));};
if($("fileIn").files&&$("fileIn").files.length)loadVid($("fileIn").files.item(0));

vid.onloadedmetadata=async()=>{try{await vid.play();vid.pause();}catch(e){}cacheAllFrames();};
$("ply").onclick=()=>{if(playing){clearInterval(tmr);playing=false;$("ply").textContent="Play";render(cur);return;}playing=true;$("ply").textContent="Pause";tmr=setInterval(()=>render((cur+1)%frames.length),1000/fps);};
$("prv").onclick=()=>{clearInterval(tmr);playing=false;$("ply").textContent="Play";render(cur-Number($("stp").value));};
$("nxt").onclick=()=>{clearInterval(tmr);playing=false;$("ply").textContent="Play";render(cur+Number($("stp").value));};
$("scb").oninput=()=>{clearInterval(tmr);playing=false;$("ply").textContent="Play";render(Number($("scb").value));};
Array.of("mode","stp","thr","gn","oni"].forEach(id=>$(id).oninput=()=>render(cur));
$("chkBg").onchange=()=>$("wrap").classList.toggle("checker",$("chkBg").checked);

$("expBtn").onclick=async()=>{
  if(!frames.length)return;clearInterval(tmr);playing=false;$("expBtn").disabled=true;
  const zip=new JSZip(),fld=zip.folder("sakuga_lines");
  for(let i=0;i<frames.length;i++){
    $("st").textContent="Exporting "+(i+1)+"/"+frames.length+"...";
    tX.putImageData(extract(frames.at(i),null,0,0,0,false),0,0);
    const b=await new Promise(r=>tC.toBlob(r,"image/png"));fld.file("frame_"+String(i+1).padStart(4,"0")+".png",b);
  }
  $("st").textContent="Zipping...";const zb=await zip.generateAsync({type:"blob"}),a=document.createElement("a");
  a.href=URL.createObjectURL(zb);a.download="sakuga_transparent_lines.zip";a.click();
  $("st").textContent="Exported "+frames.length+" transparent PNGs!";$("expBtn").disabled=false;render(cur);
};
</script>
</body>
</html>
